server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Serve real files (favicon, robots, assets) directly
  location ~* \.(?:png|jpg|jpeg|gif|svg|ico|css|js|txt|xml|webp|woff2?)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
  }

  # SPA fallback for client routes only
  location / {
    try_files $uri $uri/ /index.html;
  }
}
